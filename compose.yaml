services:
  app:
    image: 1panel/laya-server:${LAYA_IMAGE_TAG:-latest}
    environment:
      - LAYA_ADMIN_USERNAME
      - LAYA_ADMIN_PASSWORD
      - LAYA_DEVICE=${LAYA_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
    ports:
      - "${LAYA_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - ./models:/opt/models
    restart: unless-stopped
    init: true
