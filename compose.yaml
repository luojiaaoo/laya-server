services:
  app:
    image: 1panel/laya-server:${LAYA_IMAGE_TAG:-latest}
    environment:
      - LAYA_ADMIN_USERNAME
      - LAYA_ADMIN_PASSWORD
      - LAYA_DEVICE=${LAYA_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - laya-data:/data
    restart: unless-stopped
    init: true

volumes:
  laya-data:
